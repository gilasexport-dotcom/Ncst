<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت کاربران</title><style>body{font-family:system-ui,Tahoma;background:#07111f;color:#eef;padding:25px}.wrap{max-width:1100px;margin:auto}.box{background:#0d1b2e;border:1px solid #263b55;border-radius:18px;padding:20px}button{padding:9px 13px;border:0;border-radius:9px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:10px;border-bottom:1px solid #263b55;text-align:right}</style></head><body><div class="wrap"><div class="box"><h1>مدیریت کاربران</h1><button id="reload">بارگذاری</button><div id="out"></div></div></div><script>
const API="https://shy-snow-16a6.gilasexport.workers.dev";const out=document.getElementById("out");
async function load(){const r=await fetch(API+"/api/admin/users",{credentials:"include",headers:{"X-CSRF-Token":sessionStorage.getItem("SA_CSRF")||""}});const d=await r.json();if(!r.ok)return out.textContent=d?.error?.message||"خطا";out.innerHTML="<table><tr><th>ایمیل</th><th>نقش</th><th>وضعیت</th><th>تأیید ایمیل</th></tr>"+d.users.map(u=>`<tr><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.role)}</td><td>${escapeHtml(u.status)}</td><td>${u.email_verified_at?"بله":"خیر"}</td></tr>`).join("")+"</table>"}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
document.getElementById("reload").onclick=load;load();
</script></body></html>
