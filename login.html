<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ورود امن</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080c18;color:#fff}
body{display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#11182a;border:1px solid #27314a;border-radius:26px;padding:28px;box-shadow:0 20px 70px #0008}
.logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#1e293b;margin:auto auto 18px;font-size:28px}
h1{text-align:center;font-size:25px;margin:0 0 8px}
.sub{text-align:center;color:#9aa6bd;font-size:14px;margin-bottom:24px}
.tabs{display:flex;gap:8px;background:#0b1020;padding:5px;border-radius:14px;margin-bottom:18px}
.tab{flex:1;border:0;border-radius:10px;padding:11px;background:transparent;color:#9aa6bd;cursor:pointer}
.tab.active{background:#24304a;color:#fff}
label{display:block;font-size:13px;color:#b8c2d6;margin:12px 0 7px}
input{width:100%;height:50px;border-radius:13px;border:1px solid #303b55;background:#0b1020;color:#fff;padding:0 14px;font-size:16px;outline:none}
input:focus{border-color:#7285b0}
button.primary{width:100%;height:50px;border:0;border-radius:13px;background:#fff;color:#090d18;font-weight:700;font-size:15px;margin-top:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.google{width:100%;display:flex;justify-content:center;margin-top:14px;min-height:44px}
.sep{display:flex;align-items:center;gap:10px;color:#6f7a91;font-size:12px;margin:17px 0}
.sep:before,.sep:after{content:"";height:1px;background:#29344b;flex:1}
.msg{min-height:24px;text-align:center;margin-top:14px;font-size:13px;color:#ffb4b4}
.hidden{display:none!important}
.otp{letter-spacing:7px;text-align:center;font-size:21px;direction:ltr}
.note{text-align:center;color:#71809b;font-size:11px;line-height:1.8;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<div class="logo">🔐</div>
<h1>ورود امن</h1>
<div class="sub">ورود سریع با حساب Google یا شماره موبایل</div>

<div class="tabs">
<button class="tab active" data-mode="google">Google</button>
<button class="tab" data-mode="phone">پیامک</button>
</div>

<section id="googlePanel">
<div class="google" id="googleButton"></div>
</section>

<section id="phonePanel" class="hidden">
<label for="phone">شماره موبایل</label>
<input id="phone" inputmode="tel" autocomplete="tel" placeholder="09121234567" maxlength="13">
<button class="primary" id="sendBtn">ارسال کد</button>

<div id="otpBox" class="hidden">
<label for="otp">کد ۶ رقمی</label>
<input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
<button class="primary" id="verifyBtn">تأیید و ورود</button>
</div>
</section>

<div id="message" class="msg" aria-live="polite"></div>
<div class="note">اتصال امن و مدیریت نشست توسط Cloudflare Worker انجام می‌شود.</div>
</main>

<script>
(() => {
"use strict";

/*
 * Only the public API origin and public Google Client ID belong in frontend.
 * NEVER place APIIR_BEARER, OTP_PEPPER or any private secret here.
 */
const CONFIG = Object.freeze({
  API_BASE: "https://YOUR-WORKER.example.workers.dev",
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
  SUCCESS_URL: "index.html"
});

let challengeId = null;

const $ = id => document.getElementById(id);
const message = text => $("message").textContent = text;

function api(path, options = {}) {
  return fetch(CONFIG.API_BASE + path, {
    credentials: "include",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
}

async function readResponse(response) {
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false) {
    throw new Error(data?.error?.message || "درخواست ناموفق بود.");
  }
  return data;
}

async function initGoogle() {
  if (!window.google?.accounts?.id) {
    setTimeout(initGoogle, 150);
    return;
  }

  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: async response => {
      try {
        message("در حال ورود...");
        const r = await api("/api/auth/google", {
          method: "POST",
          body: JSON.stringify({ credential: response.credential, deviceName: "Google" })
        });
        await readResponse(r);
        location.replace(CONFIG.SUCCESS_URL);
      } catch (e) {
        message(e.message);
      }
    },
    auto_select: false,
    cancel_on_tap_outside: true
  });

  google.accounts.id.renderButton($("googleButton"), {
    theme: "outline",
    size: "large",
    width: 320,
    text: "signin_with",
    shape: "rectangular"
  });
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    const google = tab.dataset.mode === "google";
    $("googlePanel").classList.toggle("hidden", !google);
    $("phonePanel").classList.toggle("hidden", google);
    message("");
  });
});

$("sendBtn").addEventListener("click", async () => {
  const phone = $("phone").value.trim();
  $("sendBtn").disabled = true;
  try {
    const r = await api("/api/auth/phone/request", {
      method: "POST",
      body: JSON.stringify({ phone, deviceName: "Mobile" })
    });
    const data = await readResponse(r);
    challengeId = data.challengeId;
    $("otpBox").classList.remove("hidden");
    message("اگر شماره معتبر باشد، کد ارسال شده است.");
  } catch (e) {
    message(e.message);
  } finally {
    setTimeout(() => $("sendBtn").disabled = false, 30000);
  }
});

$("verifyBtn").addEventListener("click", async () => {
  const phone = $("phone").value.trim();
  const code = $("otp").value.trim();

  $("verifyBtn").disabled = true;
  try {
    if (!challengeId) throw new Error("ابتدا درخواست کد کنید.");
    const r = await api("/api/auth/phone/verify", {
      method: "POST",
      body: JSON.stringify({ phone, code, challengeId, deviceName: "Mobile" })
    });
    await readResponse(r);
    location.replace(CONFIG.SUCCESS_URL);
  } catch (e) {
    message(e.message);
  } finally {
    $("verifyBtn").disabled = false;
  }
});

initGoogle();
})();
</script>
</body>
</html>
